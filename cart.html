<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - GlowSkin Clinic</title>
    <link rel="stylesheet" href="external.css">
    <style>
        .order-summary {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            max-width: 500px;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 16px;
        }
        
        .summary-row.subtotal {
            color: #555;
        }
        
        .summary-row.gst {
            color: #e91e63;
            font-weight: 600;
        }
        
        .summary-row.final-total {
            border-top: 2px solid #ddd;
            padding-top: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #27ae60;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
            margin: 10px 0;
            background: #fff;
        }

        .item-info {
            display: flex;
            gap: 15px;
            flex: 1;
        }

        .item-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
        }

        .item-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .item-name {
            font-weight: 600;
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
        }

        .item-qty {
            font-size: 14px;
            color: #777;
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #f9f9f9;
        }

        .qty-btn {
            background: none;
            border: none;
            padding: 8px 10px;
            cursor: pointer;
            font-size: 16px;
            color: #27ae60;
            font-weight: bold;
            transition: background 0.2s;
        }

        .qty-btn:hover {
            background: #f0f0f0;
        }

        .qty-display {
            padding: 8px 12px;
            min-width: 40px;
            text-align: center;
            font-weight: 600;
            color: #333;
        }

        .item-price {
            font-weight: bold;
            font-size: 16px;
            color: #27ae60;
            min-width: 100px;
            text-align: right;
            margin-right: 15px;
        }

        /* Stronger, more specific rules to ensure the remove button stays the intended pink (#e91e63) */
        .cart-container .cart-item .remove-btn {
            background: #e91e63 !important;
            color: #fff !important;
            border: none !important;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            -webkit-appearance: none;
            -webkit-tap-highlight-color: transparent;
        }

        .cart-container .cart-item .remove-btn:hover {
            background: #c2185b !important;
        }

        .cart-container .cart-item .remove-btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(233,30,99,0.18);
        }

        .cart-container .cart-item .remove-btn:active {
            transform: translateY(1px);
        }

        @media (max-width: 768px) {
            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .item-actions {
                width: 100%;
                margin-top: 10px;
                justify-content: space-between;
            }

            .item-price {
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">GlowSkin Clinic</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="feedback.html">Feedback</a></li>
            </ul>
        </div>
    </nav>

    <section class="cart-hero">
        <h1>Your Shopping Cart</h1>
        <p>Products + Services • Cash on Delivery</p>
    </section>

    <section class="cart-section">
        <div class="cart-container">
            <!-- Tabs for Products/Services -->
            <div class="cart-tabs">
                <button class="tab-btn active" onclick="showTab('all')">All Items (0)</button>
                <button class="tab-btn" onclick="showTab('products')">Products (0)</button>
                <button class="tab-btn" onclick="showTab('services')">Services (0)</button>
            </div>

            <div id="cartItems" class="cart-items"></div>
            
            <!-- Order Summary with GST -->
            <div id="orderSummary" class="order-summary" style="display:none;">
                <div class="summary-row subtotal">
                    <span>Subtotal:</span>
                    <span id="subtotalAmount">₹0</span>
                </div>
                <div class="summary-row gst">
                    <span>GST (18%):</span>
                    <span id="gstAmount">₹0</span>
                </div>
                <div class="summary-row final-total">
                    <span>Total Amount:</span>
                    <span id="finalTotal">₹0</span>
                </div>
            </div>
            
            <div id="checkoutSection" style="display:none;">
                <form id="checkoutForm">
                    <div>
                        <label for="customerName">Full Name</label>
                        <input type="text" id="customerName" required>
                    </div>
                    <div>
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" required>
                    </div>
                    <div>
                        <label for="address">Address</label>
                        <textarea id="address" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="checkout-btn" id="checkoutBtn">Confirm COD Order</button>
                </form>
            </div>
            
            <div id="emptyCart" class="empty-cart" style="display:none;">
                <p>Your cart is empty 😊</p>
                <a href="products.html">Continue Shopping →</a>
            </div>
        </div>
    </section>

    <script>
        // Load carts from LocalStorage
        let productCart = JSON.parse(localStorage.getItem('skinClinicCart')) || [];
        let serviceCart = JSON.parse(localStorage.getItem('skinClinicServices')) || [];
        let currentTab = 'all';
        const GST_RATE = 0.18; // 18% GST

        // Safe number parser (removes currency symbols/commas)
        function parseNumber(val) {
            if (typeof val === 'number') return val;
            if (!val && val !== 0) return 0;
            const num = Number(String(val).replace(/[^0-9.-]+/g, ''));
            return isNaN(num) ? 0 : num;
        }

        // Initialize Cart Display
        function initCart() {
            updateCartDisplay();
            setupEventListeners();
        }

        // Calculate totals with GST
        function calculateTotals(items) {
            const subtotal = items.reduce((sum, item) => {
                const price = parseNumber(item.price);
                const qty = parseNumber(item.quantity);
                return sum + price * qty;
            }, 0);
            const gst = +(subtotal * GST_RATE);
            const total = +(subtotal + gst);
            return { subtotal, gst, total };
        }

        // Increase item quantity
        function increaseQuantity(index, isService) {
            const cart = isService ? serviceCart : productCart;
            if (cart[index]) {
                cart[index].quantity = parseNumber(cart[index].quantity) + 1;
                saveCart();
                updateCartDisplay();
            }
        }

        // Decrease item quantity
        function decreaseQuantity(index, isService) {
            const cart = isService ? serviceCart : productCart;
            if (cart[index] && parseNumber(cart[index].quantity) > 1) {
                cart[index].quantity = parseNumber(cart[index].quantity) - 1;
                saveCart();
                updateCartDisplay();
            }
        }

        // Remove item from cart
        function removeItem(index, isService) {
            const cart = isService ? serviceCart : productCart;
            cart.splice(index, 1);
            saveCart();
            updateCartDisplay();
        }

        // Save cart to localStorage
        function saveCart() {
            localStorage.setItem('skinClinicCart', JSON.stringify(productCart));
            localStorage.setItem('skinClinicServices', JSON.stringify(serviceCart));
        }

        // Update Cart Display with Tabs
        function updateCartDisplay() {
            const allItems = [...productCart, ...serviceCart];
            const productsOnly = productCart;
            const servicesOnly = serviceCart;

            const itemsToShow = currentTab === 'products' ? productsOnly :
                               currentTab === 'services' ? servicesOnly : allItems;

            const container = document.getElementById('cartItems');
            const orderSummary = document.getElementById('orderSummary');
            const checkoutSection = document.getElementById('checkoutSection');
            const emptyCart = document.getElementById('emptyCart');
            const countEl = document.querySelector('.tab-btn:first-child');

            // If there are no items in the entire cart, show empty cart view.
            if (allItems.length === 0) {
                container.innerHTML = '';
                orderSummary.style.display = 'none';
                checkoutSection.style.display = 'none';
                emptyCart.style.display = 'block';
                if (countEl) countEl.textContent = `All Items (0)`;
                // update tab counts to zero
                document.querySelector('.tab-btn:nth-child(2)').textContent = `Products (0)`;
                document.querySelector('.tab-btn:nth-child(3)').textContent = `Services (0)`;
                return;
            }

            // There are items in the cart (maybe not in this tab)
            emptyCart.style.display = 'none';
            orderSummary.style.display = 'block';
            checkoutSection.style.display = 'block';

            if (itemsToShow.length === 0) {
                container.innerHTML = '<p>No items in this category.</p>';
            } else {
                container.innerHTML = itemsToShow.map((item, index) => {
                    const isService = serviceCart.includes(item);
                    const itemIndex = isService ? serviceCart.indexOf(item) : productCart.indexOf(item);
                    const itemTotal = parseNumber(item.price) * parseNumber(item.quantity);
                    
                    return `
                        <div class="cart-item">
                            <div class="item-info">
                                <img src="${item.image}" alt="${item.name}" class="item-image">
                                <div class="item-details">
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-qty">₹${parseNumber(item.price).toLocaleString('en-IN')} each</div>
                                </div>
                            </div>
                            <div class="item-actions">
                                <div class="quantity-control">
                                    <button class="qty-btn" onclick="decreaseQuantity(${itemIndex}, ${isService})">−</button>
                                    <div class="qty-display">${parseNumber(item.quantity)}</div>
                                    <button class="qty-btn" onclick="increaseQuantity(${itemIndex}, ${isService})">+</button>
                                </div>
                                <div class="item-price">₹${itemTotal.toLocaleString('en-IN')}</div>
                                <button class="remove-btn" onclick="removeItem(${itemIndex}, ${isService})">Remove</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Calculate and display totals with GST for the whole cart
            const totals = calculateTotals(allItems);

            document.getElementById('subtotalAmount').textContent =
                `₹${totals.subtotal.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            document.getElementById('gstAmount').textContent =
                `₹${totals.gst.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            document.getElementById('finalTotal').textContent =
                `₹${totals.total.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

            // Update tab counts
            document.querySelector('.tab-btn:nth-child(1)').textContent =
                `All Items (${allItems.reduce((sum, item) => sum + parseNumber(item.quantity), 0)})`;
            document.querySelector('.tab-btn:nth-child(2)').textContent =
                `Products (${productCart.reduce((sum, item) => sum + parseNumber(item.quantity), 0)})`;
            document.querySelector('.tab-btn:nth-child(3)').textContent =
                `Services (${serviceCart.reduce((sum, item) => sum + parseNumber(item.quantity), 0)})`;
        }

        // Tab Switching
        function showTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            // inline onclick handlers usually set `event` as a global in browsers; fall back if undefined:
            const activeBtn = (typeof event !== 'undefined' && event.target) ? event.target : document.querySelector(`.tab-btn.${tab}`);
            if (activeBtn) activeBtn.classList.add('active');
            updateCartDisplay();
        }

        // Checkout Form
        function setupEventListeners() {
            const checkoutForm = document.getElementById('checkoutForm');
            if (checkoutForm) {
                checkoutForm.addEventListener('submit', function(e) {
                    e.preventDefault();

                    // Calculate totals for whole cart
                    const allItems = [...productCart, ...serviceCart];
                    const totals = calculateTotals(allItems);

                    // Get order details
                    const orderData = {
                        name: document.getElementById('customerName').value,
                        phone: document.getElementById('phone').value,
                        address: document.getElementById('address').value,
                        products: productCart,
                        services: serviceCart,
                        subtotal: totals.subtotal,
                        gst: totals.gst,
                        total: totals.total,
                        date: new Date().toLocaleString('en-IN')
                    };

                    // Save order
                    let orders = JSON.parse(localStorage.getItem('skinClinicOrders')) || [];
                    orders.push(orderData);
                    localStorage.setItem('skinClinicOrders', JSON.stringify(orders));

                    alert('✅ Order Confirmed! Cash on Delivery.\nTeam will call you within 24 hours.');

                    // Clear carts
                    productCart = []; serviceCart = [];
                    localStorage.setItem('skinClinicCart', '[]');
                    localStorage.setItem('skinClinicServices', '[]');
                    checkoutForm.reset();
                    updateCartDisplay();
                });
            }
        }

        // Initialize when page loads
        initCart();
    </script>
</body>
</html>
