<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - GlowSkin Clinic</title>
    <link rel="stylesheet" href="external.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">GlowSkin Clinic</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="feedback.html">Feedback</a></li>
            </ul>
        </div>
    </nav>

    <section class="cart-hero">
        <h1>Your Shopping Cart</h1>
        <p>Products + Services • Cash on Delivery</p>
    </section>

    <section class="cart-section">
        <div class="cart-container">
            <!-- Tabs for Products/Services -->
            <div class="cart-tabs">
                <button class="tab-btn active" onclick="showTab('all')">All Items (0)</button>
                <button class="tab-btn" onclick="showTab('products')">Products (0)</button>
                <button class="tab-btn" onclick="showTab('services')">Services (0)</button>
            </div>

            <div id="cartItems" class="cart-items"></div>
            
            <div id="cartTotal" class="cart-total">Total: ₹0</div>
            <div id="checkoutSection" style="display:none;">
                <form id="checkoutForm">
                    <div>
                        <label for="customerName">Full Name</label>
                        <input type="text" id="customerName" required>
                    </div>
                    <div>
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" required>
                    </div>
                    <div>
                        <label for="address">Address</label>
                        <textarea id="address" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="checkout-btn" id="checkoutBtn">Confirm COD Order</button>
                </form>
            </div>
            
            <div id="emptyCart" class="empty-cart" style="display:none;">
                <p>Your cart is empty 😊</p>
                <a href="products.html">Continue Shopping →</a>
            </div>
        </div>
    </section>

    <script>
        // Load carts from LocalStorage
        let productCart = JSON.parse(localStorage.getItem('skinClinicCart')) || [];
        let serviceCart = JSON.parse(localStorage.getItem('skinClinicServices')) || [];
        let currentTab = 'all';

        // Initialize Cart Display
        function initCart() {
            updateCartDisplay();
            setupEventListeners();
        }

        // Update Cart Display with Tabs
        function updateCartDisplay() {
            const allItems = [...productCart, ...serviceCart];
            const productsOnly = productCart;
            const servicesOnly = serviceCart;
            
            const itemsToShow = currentTab === 'products' ? productsOnly : 
                               currentTab === 'services' ? servicesOnly : allItems;
            
            const container = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');
            const checkoutSection = document.getElementById('checkoutSection');
            const emptyCart = document.getElementById('emptyCart');
            const countEl = document.querySelector('.tab-btn:first-child');
            
            if (itemsToShow.length === 0) {
                container.innerHTML = '';
                totalEl.textContent = 'Total: ₹0';
                checkoutSection.style.display = 'none';
                emptyCart.style.display = 'block';
                if (countEl) countEl.textContent = `All Items (0)`;
                return;
            }
            
            emptyCart.style.display = 'none';
            checkoutSection.style.display = 'block';
            
            container.innerHTML = itemsToShow.map(item => `
                <div class="cart-item">
                    <div class="item-info">
                        <img src="${item.image}" alt="${item.name}" class="item-image">
                        <div class="item-details">
                            <div class="item-name">${item.name}</div>
                            <div class="item-qty">${item.quantity} ${item.id < 10 ? 'sessions' : 'items'}</div>
                        </div>
                    </div>
                    <div class="item-price">₹${(item.price * item.quantity).toLocaleString()}</div>
                </div>
            `).join('');

            const totalPrice = itemsToShow.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            totalEl.textContent = `Total: ₹${totalPrice.toLocaleString()}`;
            
            // Update tab counts
            document.querySelector('.tab-btn:nth-child(1)').textContent = `All Items (${allItems.reduce((sum,item)=>sum+item.quantity,0)})`;
            document.querySelector('.tab-btn:nth-child(2)').textContent = `Products (${productCart.reduce((sum,item)=>sum+item.quantity,0)})`;
            document.querySelector('.tab-btn:nth-child(3)').textContent = `Services (${serviceCart.reduce((sum,item)=>sum+item.quantity,0)})`;
        }

        // Tab Switching
        function showTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateCartDisplay();
        }

        // Checkout Form
        function setupEventListeners() {
            const checkoutForm = document.getElementById('checkoutForm');
            if (checkoutForm) {
                checkoutForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    // Get order details
                    const orderData = {
                        name: document.getElementById('customerName').value,
                        phone: document.getElementById('phone').value,
                        address: document.getElementById('address').value,
                        products: productCart,
                        services: serviceCart,
                        total: productCart.reduce((sum,item)=>sum+(item.price*item.quantity),0) + serviceCart.reduce((sum,item)=>sum+(item.price*item.quantity),0),
                        date: new Date().toLocaleString('en-IN')
                    };
                    
                    // Save order
                    let orders = JSON.parse(localStorage.getItem('skinClinicOrders')) || [];
                    orders.push(orderData);
                    localStorage.setItem('skinClinicOrders', JSON.stringify(orders));
                    
                    alert('✅ Order Confirmed! Cash on Delivery.\nTeam will call you within 24 hours.');
                    
                    // Clear carts
                    productCart = []; serviceCart = [];
                    localStorage.setItem('skinClinicCart', '[]');
                    localStorage.setItem('skinClinicServices', '[]');
                    checkoutForm.reset();
                    updateCartDisplay();
                });
            }
        }

        // Initialize when page loads
        initCart();
    </script>
</body>
</html>
